spring.application.name=member-service
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pulsefit_members}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:raj12345678}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

pulsefit.jwt.public-key-path=classpath:jwt-public.pem
pulsefit.jwt.issuer=pulsefit-auth-service
pulsefit.jwt.audience=pulsefit-api

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=PulseFit
info.app.description=PulseFit Health Clubs microservice
info.app.service=Member Service
