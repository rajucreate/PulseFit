spring.application.name=notification-service
server.port=${PORT:8087}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pulsefit_notifications}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:raj12345678}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
pulsefit.notifications.mode=${NOTIFICATION_MODE:log}
pulsefit.jwt.public-key-path=classpath:jwt-public.pem
pulsefit.jwt.issuer=pulsefit-auth-service
pulsefit.jwt.audience=pulsefit-api
