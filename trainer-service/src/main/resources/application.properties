spring.application.name=trainer-service
server.port=${PORT:8088}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pulsefit_trainers}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:raj12345678}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=4000
pulsefit.jwt.public-key-path=classpath:jwt-public.pem
pulsefit.jwt.issuer=pulsefit-auth-service
pulsefit.jwt.audience=pulsefit-api
