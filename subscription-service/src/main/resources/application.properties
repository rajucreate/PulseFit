spring.application.name=subscription-service
server.port=${PORT:8082}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pulsefit_subscriptions}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:raj12345678}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

pulsefit.jwt.public-key-path=classpath:jwt-public.pem
pulsefit.jwt.issuer=pulsefit-auth-service
pulsefit.jwt.audience=pulsefit-api
