spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
        - id: member-service
          uri: lb://MEMBER-SERVICE
          predicates:
            - Path=/api/members/**
        - id: subscription-plans
          uri: lb://SUBSCRIPTION-SERVICE
          predicates:
            - Path=/api/plans/**
        - id: subscriptions
          uri: lb://SUBSCRIPTION-SERVICE
          predicates:
            - Path=/api/subscriptions/**
        - id: attendance-service
          uri: lb://ATTENDANCE-SERVICE
          predicates:
            - Path=/api/attendance/**
server:
  port: ${PORT:8080}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

pulsefit:
  jwt:
    public-key-path: classpath:jwt-public.pem
    issuer: pulsefit-auth-service
    audience: pulsefit-api
