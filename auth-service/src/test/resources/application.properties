spring.application.name=auth-service
server.port=8084
spring.datasource.url=jdbc:h2:mem:pulsefit_auth;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

eureka.client.enabled=false

pulsefit.jwt.private-key-path=classpath:jwt-private-test.pem
pulsefit.jwt.public-key-path=classpath:jwt-public.pem
pulsefit.jwt.issuer=pulsefit-auth-service
pulsefit.jwt.audience=pulsefit-api
pulsefit.jwt.expiration-minutes=15

pulsefit.admin.bootstrap.email=admin@pulsefit.com
pulsefit.admin.bootstrap.password=Admin@PulseFit2026
pulsefit.admin.bootstrap.first-name=System
pulsefit.admin.bootstrap.last-name=Administrator

