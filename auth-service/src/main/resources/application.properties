spring.application.name=auth-service
server.port=${PORT:8084}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pulsefit_auth}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:raj12345678}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

pulsefit.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:file:./config/secrets/jwt-private.pem}
pulsefit.jwt.public-key-path=classpath:jwt-public.pem
pulsefit.jwt.issuer=pulsefit-auth-service
pulsefit.jwt.audience=pulsefit-api
pulsefit.jwt.expiration-minutes=15

pulsefit.admin.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:admin@pulsefit.com}
pulsefit.admin.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@PulseFit2026}
pulsefit.admin.bootstrap.first-name=System
pulsefit.admin.bootstrap.last-name=Administrator
pulsefit.trainee.bootstrap.email=${BOOTSTRAP_TRAINEE_EMAIL:trainee@pulsefit.com}
pulsefit.trainee.bootstrap.password=${BOOTSTRAP_TRAINEE_PASSWORD:Trainee@PulseFit2026}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
pulsefit.mail.from=${SMTP_FROM:noreply@pulsefit.local}
pulsefit.mailer.url=${MAILER_URL:http://127.0.0.1:8090}
pulsefit.app.public-url=${PUBLIC_APP_URL:http://localhost:5173}
pulsefit.invitation.hours=${INVITATION_HOURS:24}
pulsefit.reset.minutes=${RESET_MINUTES:30}

